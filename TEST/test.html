<body>
    <div>
        <canvas id="mapCan" width="1250" height="1250"></canvas>
    </div>
    <script>
        let ctx = mapCan.getContext('2d');
        let arty = new artist(ctx);
        let gam = new Game([], arty);
        let player = initPlayer();
        let map = generateMapContents(getMapMed(),gam);
        gam.map = map;
        gam.player = player;
        gam.map[player.location].entities.push(player.ship);
        var isTicking = true;
        var systemViewTick = setInterval(gameTick, 500, gam);
        var galaxyTick = "";
        //console.log(map);
        mapCan.onclick = function(){checkClick(gam);};
        renderMap(gam);
    </script>
